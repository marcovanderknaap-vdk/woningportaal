# Dagelijkse controle van het aanbod + publicatie van de testsite op GitHub Pages.
#
# Twee standen:
#  - volledig: aanbod bij alle makelaars controleren, gegevens bewaren en site publiceren
#    (elke ochtend vanzelf, of handmatig via Run workflow);
#  - alleen de site: de site opnieuw opbouwen uit de bestaande gegevens, zonder ophalen
#    (handmatig met het vinkje 'Alleen de site bijwerken', en automatisch na een codewijziging).
#
# De database en foto's worden bewaard in de aparte branch 'data', zodat de
# code-branch schoon blijft. Bij een storing stuurt GitHub automatisch een
# e-mail naar de eigenaar van de repository; met de secrets EMAIL_* en
# RAPPORT_EMAIL stuurt de applicatie daarnaast een eigen storingsrapport.
name: Dagelijkse controle

on:
  schedule:
    - cron: "17 4 * * *"   # elke dag rond 05:17/06:17 Nederlandse tijd
  workflow_dispatch:        # handmatig starten via het tabblad Actions
    inputs:
      alleen_site:
        description: "Alleen de site bijwerken (aanbod niet opnieuw ophalen)"
        type: boolean
        default: false
  push:                     # na een codewijziging: alleen de site opnieuw opbouwen
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dagelijks
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      site: ${{ steps.site.outputs.klaar }}
    env:
      # Ophalen alleen bij de dagelijkse run of een handmatige run zonder vinkje
      OPHALEN: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.alleen_site) }}
      PORTAAL_DB_PATH: ${{ github.workspace }}/databranch/portaal.sqlite3
      PORTAAL_MEDIA_ROOT: ${{ github.workspace }}/databranch/media
      DJANGO_DEBUG: "false"
      PORTAAL_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'alleen-voor-export' }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RAPPORT_EMAIL: ${{ secrets.RAPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Database ophalen uit branch 'data'
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add databranch origin/data
          else
            git worktree add --detach databranch
            (cd databranch && git checkout --orphan data && git rm -rfq . )
          fi

      - name: Database bijwerken en makelaars laden
        run: |
          python manage.py migrate --noinput
          python manage.py makelaars_laden

      - name: Aanbod controleren
        id: controle
        if: env.OPHALEN == 'true'
        run: python manage.py ophalen || echo "probleem=1" >> "$GITHUB_OUTPUT"

      - name: Database en foto's bewaren
        if: always() && env.OPHALEN == 'true'
        run: |
          cd databranch
          git config user.name "woningportaal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Aanbod bijgewerkt $(date +%F)" || echo "Geen wijzigingen"
          git push origin HEAD:data

      - name: Statische site maken
        run: python manage.py export_statisch --uit site --basis "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: site
        run: echo "klaar=ja" >> "$GITHUB_OUTPUT"

      - name: Melden als er een probleem was
        if: steps.controle.outputs.probleem == '1'
        run: |
          echo "::error::Bij een of meer makelaars ging het ophalen mis. Zie de log van stap 'Aanbod controleren'."
          exit 1

  publiceren:
    needs: ophalen
    # Ook publiceren als het ophalen bij een makelaar misging, zolang de site gemaakt is
    if: always() && needs.ophalen.outputs.site == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

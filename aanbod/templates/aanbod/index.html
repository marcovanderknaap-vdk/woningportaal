{% extends "aanbod/base.html" %}
{% block inhoud %}
<section class="held">
  <div class="held__binnen">
    <h1>Koopwoningen in Zeeland</h1>
    <p>Het actuele aanbod van {{ makelaars_aantal }} Zeeuwse makelaars, elke dag bijgewerkt.</p>
    <form class="filters" id="filters" onsubmit="return false">
      <label for="f-plaats">Woonplaats
        <select id="f-plaats" name="plaats">
          <option value="">Alle plaatsen</option>
          {% for plaats, n in plaatsen %}<option value="{{ plaats }}">{{ plaats }} ({{ n }})</option>{% endfor %}
        </select>
      </label>
      <label for="f-prijs">Prijsklasse
        <select id="f-prijs" name="prijs">
          <option value="">Alle prijzen</option>
          {% for code, label, min, max in prijsklassen %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label for="f-categorie">Woning of appartement
        <select id="f-categorie" name="categorie">
          <option value="">Alles</option>
          {% for code, label in categorieen %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label for="f-type">Soort woning
        <select id="f-type" name="type">
          <option value="">Alle soorten</option>
          {% for code, label in types %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label class="vink" for="f-besch"><input type="checkbox" id="f-besch" name="beschikbaar" value="1"> Alleen beschikbaar</label>
    </form>
  </div>
</section>

<section class="resultaten" id="resultaten">
  <div class="resultaten__kop">
    <p id="telling" aria-live="polite">{{ aantal }} woningen</p>
    <div class="weergave">
      <label class="sorteer" for="per">Per pagina
        <select id="per">
          {% for n in per_pagina %}<option value="{{ n }}"{% if n == 24 %} selected{% endif %}>{{ n }}</option>{% endfor %}
        </select>
      </label>
      <label class="sorteer" for="sorteer">Sorteer
        <select id="sorteer">
          <option value="nieuw">Nieuwste eerst</option>
          <option value="prijs-op">Prijs (laag – hoog)</option>
          <option value="prijs-af">Prijs (hoog – laag)</option>
          <option value="opp-af">Woonoppervlakte (groot – klein)</option>
          <option value="plaats">Woonplaats (A – Z)</option>
        </select>
      </label>
    </div>
  </div>
  <div class="raster" id="raster"></div>
  <p class="leeg" id="leeg" hidden>Geen woningen gevonden met deze selectie. <button type="button" id="wis">Filters wissen</button></p>
  <nav class="paginering" id="paginering" aria-label="Pagina's"></nav>
  <noscript><p class="leeg">Zet JavaScript aan om het aanbod te bekijken en te filteren.</p></noscript>
</section>

<script id="woningen-data" type="application/json">{{ woningen_json|safe }}</script>
<script>
(function () {
  const woningen = JSON.parse(document.getElementById('woningen-data').textContent);
  const form = document.getElementById('filters');
  const sorteer = document.getElementById('sorteer');
  const perSelect = document.getElementById('per');
  const raster = document.getElementById('raster');
  const telling = document.getElementById('telling');
  const leeg = document.getElementById('leeg');
  const nav = document.getElementById('paginering');
  const euro = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let pagina = 1;

  // Filters, sortering en pagina uit de URL halen (zodat een selectie te delen is)
  const params = new URLSearchParams(location.search);
  for (const el of form.elements) {
    if (!el.name || !params.has(el.name)) continue;
    if (el.type === 'checkbox') el.checked = params.get(el.name) === '1'; else el.value = params.get(el.name);
  }
  if (params.has('sorteer')) sorteer.value = params.get('sorteer');
  if (params.has('per')) perSelect.value = params.get('per');
  if (params.has('pagina')) pagina = Math.max(1, parseInt(params.get('pagina'), 10) || 1);

  function kaart(w) {
    const prijs = w.prijs ? `${euro.format(w.prijs)}${w.conditie ? ' <small>' + esc(w.conditie) + '</small>' : ''}` : (w.status === 'beschikbaar' ? 'Prijs op aanvraag' : esc(w.statusLabel));
    const kenmerken = [w.opp && `${w.opp} m² wonen`, w.perceel && `${w.perceel.toLocaleString('nl-NL')} m² perceel`, w.kamers && `${w.kamers} kamers`].filter(Boolean);
    const labels = [
      w.nieuw ? '<span class="label label--nieuw">Nieuw</span>' : '',
      w.status !== 'beschikbaar' ? `<span class="label label--${w.status}">${esc(w.statusLabel)}</span>` : ''
    ].join('');
    return `<article class="kaart${w.status === 'verkocht' ? ' kaart--verkocht' : ''}">
      <a href="${esc(w.url)}" class="kaart__link">
        <div class="kaart__foto">${w.foto ? `<img src="${esc(w.foto)}" alt="" loading="lazy">` : '<div class="geen-foto">Geen foto</div>'}<div class="labels">${labels}</div></div>
        <div class="kaart__tekst">
          <h2>${esc(w.adres || 'Adres onbekend')}</h2>
          <p class="plaats">${esc([w.postcode, w.plaats].filter(Boolean).join(' '))}</p>
          <p class="prijs">${prijs}</p>
          <p class="kenmerken">${kenmerken.map(esc).join(' · ')}</p>
          <p class="soort">${esc(w.typeLabel)}</p>
        </div>
        <div class="kaart__makelaar">
          ${w.logo ? `<img src="${esc(w.logo)}" alt="" loading="lazy">` : ''}<span>${esc(w.makelaar)}</span>
        </div>
      </a>
    </article>`;
  }

  function knoppen(huidig, totaal) {
    if (totaal <= 1) return '';
    // 1 … 4 5 [6] 7 8 … 20
    const nummers = new Set([1, totaal, huidig - 1, huidig, huidig + 1]);
    if (huidig <= 3) [2, 3, 4].forEach(n => nummers.add(n));
    if (huidig >= totaal - 2) [totaal - 1, totaal - 2, totaal - 3].forEach(n => nummers.add(n));
    const lijst = [...nummers].filter(n => n >= 1 && n <= totaal).sort((a, b) => a - b);
    let html = `<button type="button" data-pagina="${huidig - 1}" ${huidig === 1 ? 'disabled' : ''} aria-label="Vorige pagina">‹ Vorige</button>`;
    lijst.forEach((n, i) => {
      if (i && n - lijst[i - 1] > 1) html += '<span class="puntjes">…</span>';
      html += `<button type="button" data-pagina="${n}" ${n === huidig ? 'aria-current="page" class="actief"' : ''}>${n}</button>`;
    });
    html += `<button type="button" data-pagina="${huidig + 1}" ${huidig === totaal ? 'disabled' : ''} aria-label="Volgende pagina">Volgende ›</button>`;
    return html;
  }

  function toon() {
    const f = Object.fromEntries(new FormData(form));
    const [min, max] = (f.prijs || '').split('-').map(v => v === '' || v === undefined ? null : Number(v));
    const lijst = woningen.filter(w =>
      (!f.plaats || w.plaats === f.plaats) &&
      (!f.categorie || w.categorie === f.categorie) &&
      (!f.type || w.type === f.type) &&
      (!f.beschikbaar || w.status === 'beschikbaar') &&
      (!f.prijs || (w.prijs !== null && (min === null || w.prijs >= min) && (max === null || w.prijs < max)))
    );
    const s = sorteer.value;
    const nul = (v, d) => v === null || v === undefined ? d : v;
    lijst.sort({
      // Woningen met het label 'nieuw' altijd bovenaan, daarna op datum van opname
      'nieuw': (a, b) => (b.nieuw - a.nieuw) || b.sinds.localeCompare(a.sinds) || b.id - a.id,
      'prijs-op': (a, b) => nul(a.prijs, 1e12) - nul(b.prijs, 1e12),
      'prijs-af': (a, b) => nul(b.prijs, -1) - nul(a.prijs, -1),
      'opp-af': (a, b) => nul(b.opp, -1) - nul(a.opp, -1),
      'plaats': (a, b) => a.plaats.localeCompare(b.plaats) || a.adres.localeCompare(b.adres),
    }[s]);

    const per = parseInt(perSelect.value, 10);
    const totaal = Math.max(1, Math.ceil(lijst.length / per));
    pagina = Math.min(pagina, totaal);
    const start = (pagina - 1) * per;
    raster.innerHTML = lijst.slice(start, start + per).map(kaart).join('');
    nav.innerHTML = knoppen(pagina, totaal);
    telling.textContent = lijst.length === 0 ? '0 woningen'
      : lijst.length <= per ? (lijst.length === 1 ? '1 woning' : `${lijst.length} woningen`)
      : `${lijst.length} woningen · ${start + 1}–${Math.min(start + per, lijst.length)} getoond`;
    leeg.hidden = lijst.length > 0;

    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(f)) if (v) p.set(k, v);
    if (s !== 'nieuw') p.set('sorteer', s);
    if (per !== 24) p.set('per', per);
    if (pagina > 1) p.set('pagina', pagina);
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
  }

  // Bij een andere selectie altijd terug naar pagina 1
  const opnieuw = () => { pagina = 1; toon(); };
  form.addEventListener('change', opnieuw);
  sorteer.addEventListener('change', opnieuw);
  perSelect.addEventListener('change', opnieuw);
  nav.addEventListener('click', e => {
    const knop = e.target.closest('button[data-pagina]');
    if (!knop || knop.disabled) return;
    pagina = parseInt(knop.dataset.pagina, 10);
    toon();
    document.getElementById('resultaten').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('wis').addEventListener('click', () => { form.reset(); opnieuw(); });
  toon();
})();
</script>
{% endblock %}
